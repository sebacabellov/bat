<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💩 Turnos del Baño</title>
<style>
:root{--bg1:#fff4e0;--bg2:#ffd9a8;--card:#ffffffd9;--ink:#3b2314;--mute:#8a6a55;--brown:#7b4a2a;--free:#22c55e;--busy:#ef4444;--line:#00000014;--shadow:0 10px 30px #7b4a2a33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1810;--bg2:#4a2a18;--card:#3a2316d9;--ink:#fff1e0;--mute:#d2a98a;--brown:#e6a672;--line:#ffffff1a;--shadow:0 10px 30px #0006}}
:root[data-theme="dark"]{--bg1:#2a1810;--bg2:#4a2a18;--card:#3a2316d9;--ink:#fff1e0;--mute:#d2a98a;--brown:#e6a672;--line:#ffffff1a;--shadow:0 10px 30px #0006}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;bottom:-60px;font-size:var(--s);opacity:.18;animation:up var(--d) linear infinite;animation-delay:var(--l)}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin-bottom:16px}
h1{margin:0;font-size:clamp(26px,7vw,36px);letter-spacing:-.5px}
h1 .p{display:inline-block;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.15)}}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--card);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.door{text-align:center;position:relative;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:800;letter-spacing:2px;color:#fff;font-size:15px;transition:background .4s}
.free .badge{background:var(--free);box-shadow:0 0 0 0 #22c55e88;animation:pulse 1.8s infinite}
.busy .badge{background:var(--busy)}
@keyframes pulse{70%{box-shadow:0 0 0 16px #22c55e00}}
.ring{position:relative;width:190px;height:190px;margin:16px auto 8px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .g{stroke:var(--busy);stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.free .ring .g{stroke:var(--free);stroke-dashoffset:0!important}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emo{font-size:58px;line-height:1}
.busy .emo{animation:shake .5s infinite}
@keyframes shake{25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
.time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px;min-height:20px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .15s,opacity .2s}
button:active{transform:scale(.95)}
.pri{background:linear-gradient(135deg,#a0643a,#6b3b1d);color:#fff;box-shadow:0 6px 16px #6b3b1d55;width:100%;font-size:17px;padding:15px}
.sec{background:var(--line);color:var(--ink)}
.go{background:var(--free);color:#fff}
.danger{background:#ef444422;color:var(--busy)}
h2{margin:0 0 12px;font-size:18px}
input[type=text]{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#ffffff66;color:var(--ink);margin-bottom:12px}
input:focus{outline:none;border-color:var(--brown)}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{flex:1;background:var(--line);color:var(--ink);padding:10px 4px;font-size:15px}
.chip.on{background:var(--brown);color:#fff}
.chip small{display:block;font-weight:500;opacity:.8;font-size:11px}
.q{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--line);margin-bottom:8px;animation:pop .3s}
@keyframes pop{from{transform:scale(.9);opacity:0}}
.q.me{outline:2px solid var(--brown)}
.q.next{background:#22c55e26}
.num{min-width:50px;height:50px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:linear-gradient(135deg,#a0643a,#6b3b1d);color:#fff}
.q .who{flex:1;min-width:0}
.q .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.q .who span{font-size:13px;color:var(--mute)}
.q button{padding:9px 12px;font-size:14px}
.empty{text-align:center;color:var(--mute);padding:10px}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--brown);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;z-index:9;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center}
.toast.show{transform:translate(-50%,0)}
.tm{position:absolute;top:14px;right:14px;background:var(--line);padding:8px 10px;border-radius:12px;font-size:16px;z-index:3}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main>
<header>
<h1><span class="p">💩</span> Turnos del Baño <span class="p" style="animation-delay:.6s">🚽</span></h1>
<p>Saca tu número, espera tu turno y cuando salga el 💩 ¡libre!</p>
<p id="sync" style="font-size:12px;opacity:.8"></p>
</header>

<section class="card door" id="door">
<button class="tm" id="theme" aria-label="Cambiar tema">🌓</button>
<span class="badge" id="badge"></span>
<div class="ring">
<svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="g" id="arc" cx="60" cy="60" r="52"/></svg>
<div class="in"><div class="emo" id="emo">🚽</div><div class="time" id="time">--:--</div></div>
</div>
<div class="sub" id="sub"></div>
<div class="row" id="actions"></div>
</section>

<section class="card">
<h2>🎟️ Sacar número</h2>
<input type="text" id="name" maxlength="20" placeholder="Tu nombre (ej: Seba)" autocomplete="off">

<button class="pri" id="take">💩 Sacar número</button>
</section>

<section class="card">
<h2>🕒 Fila de espera <span id="count" style="color:var(--mute);font-weight:500"></span></h2>
<div id="queue"></div>
</section>

<section class="card stats">
<div><b id="sServed">0</b><span>💩 atendidos hoy</span></div>
<div><b id="sQ">0</b><span>🧻 en fila</span></div>
<div><b id="sNext">#1</b><span>🎟️ próximo número</span></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
const KEY='bano_turnos_v1', MINE='bano_mis_numeros_v1', C=326.7;
let S={counter:0,queue:[],current:null,served:0}, mine=[], lastFree=null, dbDoc=null, writing=false, again=false;
const DEV=(()=>{try{let d=localStorage.getItem('bano_dev');if(!d){d=Math.random().toString(36).slice(2);localStorage.setItem('bano_dev',d)}return d}catch(e){return Math.random().toString(36).slice(2)}})();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=ms=>{ms=Math.max(0,Math.floor(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')};

function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r);const m=localStorage.getItem(MINE);if(m)mine=JSON.parse(m)}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push()}
async function push(){
  if(!dbDoc)return;
  if(writing){again=true;return}
  writing=true;
  try{await dbDoc.set(JSON.parse(JSON.stringify(S)))}catch(e){toast('⚠️ No se pudo guardar en la nube')}
  writing=false;
  if(again){again=false;push()}
}
function sync(on){$('sync').textContent=on?'🌐 En vivo entre todos tus dispositivos':'📴 Solo este navegador (sin conexión compartida)'}
async function initDb(){
  try{
    const db=await claude.use('db');
    if(!db){sync(false);return}
    const ref=db.doc('bano/estado');
    ref.onSnapshot(snap=>{
      S=Object.assign({counter:0,queue:[],current:null,served:0},snap.exists?JSON.parse(JSON.stringify(snap.data())):{});
      dbDoc=ref;sync(true);render();
    },()=>{dbDoc=null;sync(false)});
  }catch(e){sync(false)}
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2600)}

function enter(t){S.current={n:t.n,name:t.name,start:Date.now()}}
function take(){
  const name=$('name').value.trim()||'Anónimo';
  const t={n:++S.counter,name,dev:DEV};
  if(!S.current&&S.queue.length===0){enter(t);toast('🚽 ¡Pasa! Eres el #'+t.n+' y el baño es tuyo')}
  else{S.queue.push(t);toast('🎟️ Tu número es el #'+t.n)}
  save();render()
}
function enterNext(n){if(S.current||!S.queue.length||S.queue[0].n!==n)return;enter(S.queue.shift());save();render()}
function finish(){if(!S.current)return;S.current=null;S.served++;save();render()}

function cancel(n){S.queue=S.queue.filter(t=>t.n!==n);save();render()}

function render(){
  const c=S.current, now=Date.now(), door=$('door');
  door.className='card door '+(c?'busy':'free');
  $('badge').textContent=c?'⛔ OCUPADO':'✅ LIBRE';
  $('emo').textContent=c?'💩':'🚽';
  let acts='';
  if(c){
    const el=now-c.start, m=Math.floor(el/60000);
    $('time').textContent=fmt(el);
    $('arc').style.strokeDashoffset=C*(1-Math.min(el/900000,1));
    const jab=m>=30?' · 🚨 Mandemos a alguien a revisar':m>=15?' · ¿Todo bien ahí? 💩':'';
    $('sub').innerHTML='Lo usa <b>#'+c.n+' '+esc(c.name)+'</b>'+jab;
    acts='<button class="go" data-a="fin">✔ Ya salí</button>';
    document.title='⛔ Ocupado '+fmt(el)+' · 💩';
  }else{
    $('time').textContent='LIBRE';
    $('sub').textContent=S.queue.length?'Turno del #'+S.queue[0].n+' ('+esc(S.queue[0].name)+')':'Nadie en fila. ¡Corre!';
    if(S.queue.length)acts='<button class="go" data-a="enter" data-n="'+S.queue[0].n+'">🚪 Entrar (#'+S.queue[0].n+')</button>';
    document.title='✅ Libre · 💩 Turnos del Baño';
  }
  $('actions').innerHTML=acts;
  let html='';
  S.queue.forEach((t,i)=>{
    const me=t.dev===DEV;
    html+='<div class="q'+(me?' me':'')+(i===0?' next':'')+'"><div class="num">#'+t.n+'</div><div class="who"><b>'+esc(t.name)+(me?' (tú)':'')+'</b><span>Posición '+(i+1)+(i===0?' · el próximo 🎯':'')+'</span></div>'+(me?'<button class="danger" data-a="cancel" data-n="'+t.n+'">Salir</button>':'')+'</div>';
    
  });
  $('queue').innerHTML=html||'<div class="empty">🧻 Fila vacía</div>';
  $('count').textContent=S.queue.length?'('+S.queue.length+')':'';
  $('sServed').textContent=S.served;$('sQ').textContent=S.queue.length;$('sNext').textContent='#'+(S.counter+1);
  const isFree=!c;
  if(lastFree===false&&isFree){const nx=S.queue[0];toast(nx?'✅ Baño libre. Turno del #'+nx.n:'✅ ¡El baño quedó libre!')}
  lastFree=isFree;
}

function tick(){render()}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,n=+b.dataset.n;
  if(a==='fin')finish();else if(a==='enter')enterNext(n);else if(a==='cancel')cancel(n)
});
$('take').onclick=take;
$('name').addEventListener('keydown',e=>{if(e.key==='Enter')take()});


$('theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).getPropertyValue('--bg1').trim()==='#2a1810';d.dataset.theme=dark?'light':'dark'};
window.addEventListener('storage',e=>{if(e.key===KEY&&!dbDoc){load();render()}});

const bg=$('bg');
for(let i=0;i<14;i++){const s=document.createElement('span');s.textContent=i%4===0?'🧻':'💩';s.style.cssText='left:'+Math.random()*100+'%;--s:'+(24+Math.random()*40)+'px;--d:'+(14+Math.random()*16)+'s;--l:-'+Math.random()*20+'s';bg.appendChild(s)}

load();render();setInterval(tick,1000);initDb();
</script>
</body>
</html>
