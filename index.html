<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>💩 Turnos del Baño</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💩</text></svg>">
<style>
:root{--bg1:#fff4e0;--bg2:#ffd9a8;--card:#ffffffd9;--ink:#3b2314;--mute:#8a6a55;--brown:#7b4a2a;--free:#22c55e;--busy:#ef4444;--line:#00000014;--shadow:0 10px 30px #7b4a2a33;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a1810;--bg2:#4a2a18;--card:#3a2316d9;--ink:#fff1e0;--mute:#d2a98a;--brown:#e6a672;--line:#ffffff1a;--shadow:0 10px 30px #0006}}
:root[data-theme="dark"]{--bg1:#2a1810;--bg2:#4a2a18;--card:#3a2316d9;--ink:#fff1e0;--mute:#d2a98a;--brown:#e6a672;--line:#ffffff1a;--shadow:0 10px 30px #0006}
*{box-sizing:border-box}
html,body{margin:0}
body{min-height:100vh;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
.bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.bg span{position:absolute;bottom:-60px;opacity:.18;animation:up var(--d,18s) linear infinite;animation-delay:var(--l,0s);user-select:none}
@keyframes up{to{transform:translateY(-120vh) rotate(360deg)}}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:20px 16px 40px}
header{text-align:center;margin-bottom:16px}
h1{margin:0;font-size:clamp(26px,7vw,36px);letter-spacing:-.5px}
h1 .p{display:inline-block;animation:wob 2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(14deg) scale(1.15)}}
header p{margin:4px 0 0;color:var(--mute);font-size:14px}
.card{background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px}
.door{text-align:center;position:relative;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-weight:800;letter-spacing:2px;color:#fff;font-size:15px;transition:background .4s}
.free .badge{background:var(--free);box-shadow:0 0 0 0 #22c55e88;animation:pulse 1.8s infinite}
.busy .badge{background:var(--busy)}
@keyframes pulse{70%{box-shadow:0 0 0 16px #22c55e00}}
.ring{position:relative;width:190px;height:190px;margin:16px auto 8px}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring circle{fill:none;stroke-width:10;stroke-linecap:round}
.ring .t{stroke:var(--line)}
.ring .g{stroke:var(--busy);stroke-dasharray:326.7;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear}
.free .ring .g{stroke:var(--free);stroke-dashoffset:0!important}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.emo{font-size:58px;line-height:1}
.busy .emo{animation:shake .5s infinite}
@keyframes shake{25%{transform:translateX(-3px) rotate(-6deg)}75%{transform:translateX(3px) rotate(6deg)}}
.time{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.sub{color:var(--mute);font-size:14px;min-height:20px}
.row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
button{font:inherit;cursor:pointer;border:0;border-radius:14px;padding:12px 18px;font-weight:700;transition:transform .15s,opacity .2s}
button:active{transform:scale(.95)}
button:disabled,input:disabled{opacity:.5;cursor:not-allowed}
.pri{background:linear-gradient(135deg,#a0643a,#6b3b1d);color:#fff;box-shadow:0 6px 16px #6b3b1d55;width:100%;font-size:17px;padding:15px}
.sec{background:var(--line);color:var(--ink)}
.go{background:var(--free);color:#fff;padding:12px 24px;box-shadow:0 4px 12px rgba(34,197,94,.3)}
input[type=text]{width:100%;font:inherit;padding:13px 14px;border-radius:14px;border:2px solid var(--line);background:#ffffff66;color:var(--ink);margin-bottom:12px}
input:focus{outline:none;border-color:var(--brown)}
.stats{display:flex;justify-content:space-around;text-align:center}
.stats b{display:block;font-size:24px}
.stats span{font-size:12px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--brown);color:#fff;padding:14px 22px;border-radius:16px;font-weight:700;z-index:99;transition:transform .4s cubic-bezier(.3,1.5,.5,1);max-width:90%;text-align:center;box-shadow:0 10px 25px rgba(0,0,0,.25);pointer-events:none}
.toast.show{transform:translate(-50%,0)}
.tm{position:absolute;top:14px;right:14px;background:var(--line);padding:8px 10px;border-radius:12px;font-size:16px;z-index:3}
.sync-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#22c55e;margin-right:6px}
.sync-dot.offline{background:#ef4444}
.sync-dot.recon{background:#f59e0b}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<main>
<header>
<h1><span class="p">💩</span> Turnos del Baño <span class="p" style="animation-delay:.6s">🚽</span></h1>
<p>Con el baño libre sacas tu número y entras. Ocupado... ¡a aguantar! 😬</p>
<p id="sync" style="font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:6px;font-weight:600">
  <span class="sync-dot" id="syncDot"></span>
  <span id="syncText">Sincronizando en tiempo real...</span>
</p>
</header>

<section class="card door" id="door">
<button class="tm" id="theme" aria-label="Cambiar tema">🌓</button>
<span class="badge" id="badge"></span>
<div class="ring">
<svg viewBox="0 0 120 120"><circle class="t" cx="60" cy="60" r="52"/><circle class="g" id="arc" cx="60" cy="60" r="52"/></svg>
<div class="in"><div class="emo" id="emo">🚽</div><div class="time" id="time">--:--</div></div>
</div>
<div class="sub" id="sub"></div>
<div class="row" id="actions"></div>
</section>

<section class="card">
<h2 style="margin:0 0 12px;font-size:18px">🎟️ Sacar número</h2>
<input type="text" id="name" maxlength="20" placeholder="Tu nombre (ej: Seba)" autocomplete="off">
<button class="pri" id="take">💩 Sacar número</button>
</section>

<section class="card stats">
<div><b id="sServed">0</b><span>💩 atendidos hoy</span></div>
<div><b id="sNext">#1</b><span>🎟️ próximo número</span></div>
</section>
</main>
<div class="toast" id="toast"></div>

<script>
// Detecta la URL del servidor automáticamente
const SERVER = window.location.origin.startsWith('http') ? window.location.origin : '';
const C = 326.7;
let S = { counter: 0, served: 0, current: null };
let lastFree = null, serverOffset = 0, eventSource = null;
const DEV = (() => {
  try {
    let d = localStorage.getItem('bano_dev');
    if (!d) {
      d = Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('bano_dev', d);
    }
    return d;
  } catch(e) {
    return 'dev_' + Math.random().toString(36).slice(2);
  }
})();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = ms => {
  ms = Math.max(0, Math.floor(ms / 1000));
  return String(Math.floor(ms / 60)).padStart(2, '0') + ':' + String(ms % 60).padStart(2, '0');
};

function toast(t) {
  const e = $('toast');
  e.textContent = t;
  e.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => e.classList.remove('show'), 2800);
}

function updateSyncBadge(status) {
  const dot = $('syncDot');
  const txt = $('syncText');
  if (status === 'connected') {
    dot.className = 'sync-dot';
    txt.textContent = '🌐 En vivo sincronizado entre todos tus dispositivos';
  } else if (status === 'recon') {
    dot.className = 'sync-dot recon';
    txt.textContent = '🔄 Reconectando sincronización...';
  } else {
    dot.className = 'sync-dot offline';
    txt.textContent = '📴 Sin conexión al servidor';
  }
}

async function fetchState() {
  try {
    const res = await fetch(SERVER + '/api/state');
    if (res.ok) {
      const data = await res.json();
      if (data.serverTime) serverOffset = data.serverTime - Date.now();
      S = { counter: data.counter || 0, served: data.served || 0, current: data.current || null };
      updateSyncBadge('connected');
      render();
    }
  } catch(e) {
    updateSyncBadge('offline');
  }
}

function initSSE() {
  if (eventSource) eventSource.close();
  updateSyncBadge('recon');
  eventSource = new EventSource(SERVER + '/api/sync/stream');

  eventSource.onopen = () => updateSyncBadge('connected');

  eventSource.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (data.serverTime) serverOffset = data.serverTime - Date.now();
      S = { counter: data.counter || 0, served: data.served || 0, current: data.current || null };
      updateSyncBadge('connected');
      render();
    } catch(e) {}
  };

  eventSource.onerror = () => {
    updateSyncBadge('recon');
    eventSource.close();
    setTimeout(initSSE, 3500);
  };
}

async function take() {
  if (S.current) {
    toast('⛔ El baño está ocupado');
    return;
  }
  const name = $('name').value.trim() || 'Anónimo';
  $('take').disabled = true;
  try {
    const res = await fetch(SERVER + '/api/take', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, dev: DEV })
    });
    const data = await res.json();
    if (res.ok && data.success) {
      toast('🚽 ¡Pasa! Eres el #' + data.state.current.n + ' y el baño es tuyo');
      S = data.state;
      render();
    } else {
      toast(data.error || '⛔ Alguien acaba de entrar');
      if (data.state) { S = data.state; render(); }
    }
  } catch(e) {
    toast('⚠️ Error de conexión con el servidor');
  } finally {
    $('take').disabled = !!S.current;
  }
}

async function finish() {
  if (!S.current) return;
  try {
    const res = await fetch(SERVER + '/api/finish', { method: 'POST' });
    const data = await res.json();
    if (res.ok && data.success) {
      toast('✅ ¡Baño desocupado exitosamente!');
      S = data.state;
      render();
    }
  } catch(e) {
    toast('⚠️ Error al liberar el baño');
  }
}

function render() {
  const c = S.current;
  const now = Date.now() + serverOffset;
  const door = $('door');
  door.className = 'card door ' + (c ? 'busy' : 'free');
  $('badge').textContent = c ? '⛔ OCUPADO' : '✅ LIBRE';
  $('emo').textContent = c ? '💩' : '🚽';

  let acts = '';
  if (c) {
    const el = Math.max(0, now - c.start);
    const m = Math.floor(el / 60000);
    $('time').textContent = fmt(el);
    $('arc').style.strokeDashoffset = C * (1 - Math.min(el / 900000, 1));
    const jab = m >= 30 ? ' · 🚨 Mandemos a alguien a revisar' : m >= 15 ? ' · ¿Todo bien ahí? 💩' : '';
    $('sub').innerHTML = 'Lo usa <b>#' + c.n + ' ' + esc(c.name) + '</b>' + jab;
    acts = '<button class="go" id="btnFinish">✔ Ya salí</button>';
    document.title = '⛔ Ocupado ' + fmt(el) + ' · 💩';
  } else {
    $('time').textContent = 'LIBRE';
    $('sub').textContent = 'Nadie adentro. ¡Corre! 🏃💨';
    document.title = '✅ Libre · 💩 Turnos del Baño';
  }

  $('actions').innerHTML = acts;
  const finishBtn = $('btnFinish');
  if (finishBtn) finishBtn.onclick = finish;

  $('sServed').textContent = S.served;
  $('sNext').textContent = '#' + (S.counter + 1);
  $('take').disabled = !!c;
  $('name').disabled = !!c;
  $('take').textContent = c ? '⛔ Baño ocupado, espera a que se libere' : '💩 Sacar número';

  const isFree = !c;
  if (lastFree === false && isFree) {
    toast('✅ ¡El baño quedó libre!');
  }
  lastFree = isFree;
}

$('take').onclick = take;
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') take(); });
$('theme').onclick = () => {
  const d = document.documentElement;
  const dark = d.dataset.theme === 'dark' || (!d.dataset.theme && window.matchMedia('(prefers-color-scheme: dark)').matches);
  d.dataset.theme = dark ? 'light' : 'dark';
};

window.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') fetchState(); });
window.addEventListener('focus', fetchState);

// Fondo de emojis animados
const bg = $('bg');
for (let i = 0; i < 14; i++) {
  const s = document.createElement('span');
  s.textContent = i % 4 === 0 ? '🧻' : '💩';
  s.style.cssText = 'left:' + Math.random() * 100 + '%;font-size:' + (24 + Math.random() * 40) + 'px;--d:' + (14 + Math.random() * 16) + 's;--l:-' + Math.random() * 20 + 's';
  bg.appendChild(s);
}

fetchState();
initSSE();
setInterval(render, 1000);
</script>
</body>
</html>
